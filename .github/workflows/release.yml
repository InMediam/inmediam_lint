name: Release

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm ci

      # Passo temporário de diagnóstico: o npm engole o erro do token exchange
      # (lib/utils/oidc.js nunca lança) e só reporta ENEEDAUTH. Isto expõe o motivo real.
      - name: Debug trusted publishing (OIDC)
        run: |
          set -euo pipefail
          echo "npm: $(npm --version)"
          echo "GITHUB_WORKFLOW_REF: ${GITHUB_WORKFLOW_REF}"

          ID_TOKEN=$(curl -sS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r .value)

          echo "--- claims que o npm compara com a config do Trusted Publisher ---"
          node -e 'console.log(Buffer.from(process.argv[1].split(".")[1], "base64url").toString())' "$ID_TOKEN" \
            | jq '{repository, repository_owner, workflow_ref, job_workflow_ref, environment, ref}'

          echo "--- resposta do token exchange do npm ---"
          STATUS=$(curl -sS -o /tmp/exchange.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@inmediam%2flint")
          echo "HTTP ${STATUS}"
          jq -r 'if .token then "OK: exchange funcionou" else (.message // tostring) end' /tmp/exchange.json

      - name: Publish to NPM
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
