name: Version

permissions:
  contents: write

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  version:
    name: Version packages
    runs-on: ubuntu-latest
    # Forks recebem um GITHUB_TOKEN somente leitura — não há como commitar de volta.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          # O checkout padrão de pull_request é o merge commit (detached HEAD).
          # Precisamos do branch do PR para poder commitar nele.
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm ci

      # No-op quando não há changesets pendentes (o README.md do .changeset é ignorado).
      - name: Apply changesets
        run: npm run version-packages

      # O changeset version não atualiza a versão da raiz no package-lock.json.
      # Não quebra o npm ci, mas evita que o lockfile fique defasado a cada release.
      - name: Sync lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit version bump
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nenhum changeset pendente — nada a commitar." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: version packages"
          git push origin HEAD:"$HEAD_REF"

          {
            echo "Versão aplicada e commitada em \`$HEAD_REF\`:"
            echo
            echo '```'
            git show --stat --oneline HEAD
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
